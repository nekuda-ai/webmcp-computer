    <script>
      // sh-syntax's TinyGo runtime installs a partial `process` shim without
      // `env`; react-draggable then reads process.env.* and throws in dev,
      // where module order differs from the production bundle. Guarantee the
      // shape before any module evaluates.
      globalThis.process = globalThis.process || {};
      globalThis.process.env = globalThis.process.env || {};
    </script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VerbOS — dynamic registration spike</title>
<style>body{font-family:ui-monospace,monospace;background:#071019;color:#9fd8ff;padding:40px}</style>
</head>
<body>
<h3>dynamic registration spike</h3>
<div id="log"></div>
<script type="module">
import { defineTool, registerTools } from './vendor/webmcp-sdk.js';
const log = (m) => { const d = document.createElement('div'); d.textContent = m; document.getElementById('log').appendChild(d); };

const mk = (key, name) => defineTool({
  stableKey: key,
  name,
  description: `Dynamic spike tool ${name}.`,
  inputSchema: { type: 'object', properties: {} },
  async execute() { return `${name} alive`; },
});

// A registers at load.
const regA = registerTools([mk('verbos.spike_a', 'spike_a')]);
await regA.ready; log('t=0: spike_a registered');

// B registers after 6s (simulates app window opening).
setTimeout(async () => {
  const regB = registerTools([mk('verbos.spike_b', 'spike_b')]);
  await regB.ready; log('t=6s: spike_b registered');
  // A unregisters after 12s (simulates window closing).
  setTimeout(() => { regA.unregister(); log('t=12s: spike_a unregistered'); }, 6000);
}, 6000);
</script>
</body>
</html>

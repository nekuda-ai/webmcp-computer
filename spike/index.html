<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VerbOS — spike zero</title>
<style>
  body { font-family: ui-monospace, monospace; background: #071019; color: #9fd8ff; padding: 40px; }
  h1 { font-size: 18px; letter-spacing: 0.2em; }
  .row { margin: 6px 0; }
  .ok { color: #7ee0a3; }
  .no { color: #ff7a59; }
  #calls { margin-top: 24px; border-top: 1px solid rgba(159,216,255,0.2); padding-top: 12px; }
  .call { color: #d8ecff; }
</style>
</head>
<body>
<h1>VERBOS // SPIKE ZERO — @nekuda/webmcp-sdk</h1>
<div id="report"></div>
<div id="calls"><div style="opacity:.5">tool calls appear here:</div></div>
<script type="module">
import { defineTool, registerTools, resolveModelContext } from './vendor/webmcp-sdk.js';

const report = document.getElementById('report');
const calls = document.getElementById('calls');
const log = (msg, ok) => {
  const d = document.createElement('div');
  d.className = 'row ' + (ok ? 'ok' : 'no');
  d.textContent = (ok ? '[ok] ' : '[--] ') + msg;
  report.appendChild(d);
  console.log('[spike]', msg);
};

// Surface diagnostics — which raw surfaces exist in this browser.
log(`document.modelContext: ${document.modelContext ? 'present' : 'absent'}`, !!document.modelContext);
log(`navigator.modelContext: ${navigator.modelContext ? 'present' : 'absent'}`, !!navigator.modelContext);
log(`SDK resolveModelContext(): ${resolveModelContext() ? 'resolved' : 'undefined'}`, !!resolveModelContext());

const echo = defineTool({
  stableKey: 'verbos.echo',
  name: 'verbos_echo',
  description: 'Echo text back from VerbOS spike zero. Proves the WebMCP registration path works end to end through @nekuda/webmcp-sdk.',
  inputSchema: {
    type: 'object',
    properties: { text: { type: 'string', description: 'Text to echo back' } },
    required: ['text'],
  },
  async execute(input) {
    const text = input?.text ?? JSON.stringify(input);
    const d = document.createElement('div');
    d.className = 'call';
    d.textContent = `echo(${text}) @ ${new Date().toISOString()}`;
    calls.appendChild(d);
    return `VerbOS echo: ${text}`;
  },
});

const registration = registerTools([echo]);
const results = await registration.ready;
for (const r of results) {
  log(`registerTools → ${r.name}: ${r.state}${r.error ? ` (${r.error})` : ''}`, r.state === 'registered');
}
log(results.every((r) => r.state === 'registered')
  ? 'RESULT: SDK registration live'
  : 'RESULT: no live registration in this browser', results.every((r) => r.state === 'registered'));
</script>
</body>
</html>

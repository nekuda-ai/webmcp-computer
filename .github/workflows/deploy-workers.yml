name: Deploy Workers

# Manual deploy of the Cloudflare Workers. The GitHub environment is named after the
# `environment` input, so protection rules (required reviewers, branch restrictions)
# configured on the `staging` / `production` environments apply automatically.
#
# Required environment secrets:
#   CLOUDFLARE_API_TOKEN   - Wrangler deploy token (Workers Scripts, Containers, R2,
#                            Durable Objects edit on the nekuda.ai account)
#   CLOUDFLARE_ACCOUNT_ID  - target Cloudflare account (keep it in each GitHub environment)
#
# Runtime secrets (GATEWAY_SIGNING_SECRET, CF_ACCOUNT_ID, BROWSER_RENDERING_API_TOKEN,
# PUBLIC_SITE_ORIGIN) are NOT set here. Set them once with `wrangler secret put`; see
# docs/OPERATIONS.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production
      worker:
        description: Which Worker(s) to deploy
        type: choice
        required: true
        default: both
        options:
          - both
          - computer
          - browser-session

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.3"
  WRANGLER_VERSION: "4.128.0"
  # Top-level config is production; `--env staging` selects the staging env block.
  WRANGLER_ENV_FLAG: ${{ inputs.environment == 'staging' && '--env staging' || '' }}

jobs:
  validate-ref:
    name: Validate deployment ref
    runs-on: ubuntu-latest
    steps:
      - name: Production deploys must use main
        if: ${{ inputs.environment == 'production' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Production deployments must be dispatched from main." >&2
          exit 1

  computer:
    name: Deploy webmcp-computer-cloud (${{ inputs.environment }})
    needs: validate-ref
    if: ${{ inputs.worker == 'both' || inputs.worker == 'computer' }}
    # ubuntu-latest ships Docker; the computer Worker builds workers/computer/Dockerfile
    # at deploy time.
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: workers/computer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-computer-${{ hashFiles('workers/computer/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-computer-
      - run: bun install --frozen-lockfile
      - name: Check (tests + typecheck)
        run: bun run check
      - name: Docker is available
        run: docker version
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@${{ env.WRANGLER_VERSION }} deploy ${{ env.WRANGLER_ENV_FLAG }}

  browser-session:
    name: Deploy webmcp-computer-browser-session (${{ inputs.environment }})
    needs: validate-ref
    if: ${{ inputs.worker == 'both' || inputs.worker == 'browser-session' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: workers/browser-session
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-browser-session-${{ hashFiles('workers/browser-session/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-browser-session-
      - run: bun install --frozen-lockfile
      - name: Check (tests + typecheck)
        run: bun run check
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@${{ env.WRANGLER_VERSION }} deploy ${{ env.WRANGLER_ENV_FLAG }}

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; background: #071019; }
    a { color: #2e9ff3; } a:hover { color: #6fbef7; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace; }
    .wordmark { font-family: 'Doto', 'IBM Plex Mono', monospace; font-weight: 900; letter-spacing: 0.02em; }
    .grain-dark {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .pixgrid {
      position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(rgba(159,216,255,0.09) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .crt-lines {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.08;
      background: repeating-linear-gradient(to bottom, rgba(159,216,255,0.5) 0px, rgba(159,216,255,0.5) 1px, transparent 1px, transparent 3px);
    }
    .crt-vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(2,8,14,0.55) 100%);
    }
    /* bounce: 12s horizontal, 9s vertical — both linear alternate.
       walls get hit at t = 9, 12, 18, 24, 27, 36, ... ; at 36s both hit: corner. */
    @keyframes bx { from { transform: translateX(0); } to { transform: translateX(1220px); } }
    @keyframes by { from { transform: translateY(0); } to { transform: translateY(824px); } }
    .bounce-x { animation: bx 12s linear infinite alternate; }
    .bounce-y { animation: by 9s linear infinite alternate; }
    /* hue steps ONLY at wall-hit times (36s cycle, discrete jumps) */
    @keyframes hitshift {
      0%      { filter: hue-rotate(0deg); }
      24.99%  { filter: hue-rotate(0deg); }
      25%     { filter: hue-rotate(48deg); }
      33.32%  { filter: hue-rotate(48deg); }
      33.33%  { filter: hue-rotate(105deg); }
      49.99%  { filter: hue-rotate(105deg); }
      50%     { filter: hue-rotate(160deg); }
      66.65%  { filter: hue-rotate(160deg); }
      66.66%  { filter: hue-rotate(215deg); }
      74.99%  { filter: hue-rotate(215deg); }
      75%     { filter: hue-rotate(285deg); }
      99.99%  { filter: hue-rotate(285deg); }
      100%    { filter: hue-rotate(360deg); }
    }
    .hitshift { animation: hitshift 36s linear infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
  </style>
</helmet>

<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #0d1e33 0%, #081221 62%, #050c14 100%);">

  <div class="pixgrid"></div>
  <div class="grain-dark"></div>

  <!-- ghost trail: previous wall-hit positions, previous colors -->
  <div style="position: absolute; left: 170px; top: 90px; opacity: 0.13;">
    <span class="wordmark" style="font-size: 34px; color: #00b8a9;">verbOS</span>
  </div>
  <div style="position: absolute; left: 1080px; top: 486px; opacity: 0.10;">
    <span class="wordmark" style="font-size: 34px; color: #ff7a59;">verbOS</span>
  </div>

  <!-- the bouncing wordmark -->
  <div class="bounce-x" style="position: absolute; left: 0; top: 0;">
    <div class="bounce-y">
      <div class="hitshift" style="display: flex; align-items: center; width: 220px; height: 76px; padding: 10px;">
        <span class="wordmark" style="font-size: 44px; color: #2e9ff3; text-shadow: 0 0 22px rgba(46,159,243,0.65), 0 0 4px rgba(46,159,243,0.9);">verbOS</span>
      </div>
    </div>
  </div>

  <!-- status microlabel -->
  <div class="mono" style="position: absolute; left: 24px; top: 22px; font-size: 9.5px; letter-spacing: 0.2em; color: rgba(159,216,255,0.4);">VERBOS // STATE: IDLE — SCREENSAVER PID 1</div>

  <!-- mechanics microlabel -->
  <div class="mono" style="position: absolute; right: 24px; top: 22px; font-size: 9.5px; letter-spacing: 0.16em; color: rgba(159,216,255,0.32);">HUE STEPS ON WALL HIT — 12S / 9S → CORNER EVERY 36S</div>

  <!-- wake hint -->
  <div style="position: absolute; left: 0; right: 0; bottom: 44px; display: flex; justify-content: center;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span class="blink" style="width: 8px; height: 14px; background: rgba(159,216,255,0.65); display: inline-block;"></span>
      <span class="mono" style="font-size: 10.5px; letter-spacing: 0.22em; color: rgba(216,236,255,0.55);">PRESS ANY KEY — OR CALL ANY TOOL</span>
    </div>
  </div>

  <div class="crt-lines"></div>
  <div class="crt-vignette"></div>

</div>
</x-dc>
</body>
</html>
